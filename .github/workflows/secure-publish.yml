name: secure-publish (zero-trust secrets + slsa L3 provenance)

on:
  release:
    types: [published]

permissions: {}

jobs:
  audit-and-scan:
    name: audit-and-scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/actions/runner-base:ubuntu22
      options: --user=runner
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard: only production tags
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed: only run when release tag looks like production.
          # Expected: vX.Y.Z (adjust if your release tagging differs).
          if [[ "${GITHUB_REF_NAME}" != v[0-9]+\.[0-9]+\.[0-9]+* ]]; then
            echo "Ref name '${GITHUB_REF_NAME}' is not a production semver tag."
            exit 1
          fi

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (locked)
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Dependency vulnerability + audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Lint + typecheck (repo-defined)
        shell: bash
        run: |
          set -euo pipefail
          if npm run -s lint; then :; else echo "No lint target or lint failed"; exit 1; fi
          if npm run -s build; then :; fi

  deterministic-build:
    name: deterministic-build
    runs-on: ubuntu-latest
    needs: [audit-and-scan]
    container:
      image: ghcr.io/actions/runner-base:ubuntu22
      options: --user=runner
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Harden shell execution flags
        shell: bash
        run: |
          set -euo pipefail
          echo "Hardened shell invariant: set -euo pipefail"

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (locked)
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Deterministic compile (compile-universal)
        shell: bash
        env:
          # Prevent update checks inside npm tooling
          npm_config_update_notifier: 'false'
        run: |
          set -euo pipefail
          npm run -s compile-universal

      - name: Stage distribution artifacts into sealed workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sealed

          # Fail closed if expected build outputs are missing.
          # Adjust these paths to your dual ESM/CommonJS outputs once finalized.
          # Currently we treat `dist/` as the compiled output boundary.
          if [[ ! -d dist ]]; then
            echo "dist/ directory missing."
            exit 1
          fi

          cp -R dist sealed/dist

          # Record immutable commit binding
          printf '%s' "${GITHUB_SHA}" > sealed/commit.sha

      - name: Upload sealed build workspace
        uses: actions/upload-artifact@v4
        with:
          name: sealed-build
          path: sealed
          if-no-files-found: error
          retention-days: 3

  provenance-and-sign:
    name: provenance-and-sign
    runs-on: ubuntu-latest
    needs: [deterministic-build]
    container:
      image: ghcr.io/actions/runner-base:ubuntu22
      options: --user=runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download sealed workspace
        uses: actions/download-artifact@v4
        with:
          name: sealed-build
          path: sealed

      - name: Install (for pack)
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build tarball from sealed workspace (no rebuild)
        shell: bash
        run: |
          set -euo pipefail
          # Ensure we pack from the repo state that matches sealed commit.
          if [[ ! -f sealed/commit.sha ]]; then
            echo "sealed/commit.sha missing"
            exit 1
          fi
          EXPECTED_SHA="$(cat sealed/commit.sha)"
          if [[ "$EXPECTED_SHA" != "${GITHUB_SHA}" ]]; then
            echo "Sealed commit mismatch. expected=$EXPECTED_SHA got=${GITHUB_SHA}"
            exit 1
          fi

          # Create npm package tarball.
          npm pack --ignore-scripts

          # Capture created tarball name
          TARBALL="$(ls -1 *.tgz | head -n 1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

          # Create deterministic attestation manifest (SLSA-style minimal)
          # This is a placeholder until you define the exact SLSA predicate requirements.
          mkdir -p attestation
          cat > attestation/build-manifest.json <<'EOF'
          {
            "version": 1,
            "commit": "${GITHUB_SHA}",
            "tag": "${GITHUB_REF_NAME}",
            "builder": "github-actions",
            "sealedArtifactPaths": ["sealed/dist"],
            "tarball": "${TARBALL}"
          }
EOF

      - name: Generate Sigstore/CoSign signature (transient)
        # Using cosign via sigstore tooling is optional; repository must include a way to generate it.
        # Fail closed if cosign not available.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cosign >/dev/null 2>&1; then
            echo "cosign not available in runner image. Add a cosign install step or pre-bundle." >&2
            exit 1
          fi
          cosign sign-blob --yes --output-signature attestation/tarball.sig "${TARBALL}"

      - name: Publish to GitHub Package Registry (npm.pkg.github.com)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "GITHUB_TOKEN missing" >&2
            exit 1
          fi

          # Use npm publish with registry override for GitHub packages.
          npm publish --registry "https://npm.pkg.github.com" "${TARBALL}" --access public

      - name: Upload provenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: provenance-bundle
          path: |
            attestation
            sealed/commit.sha
          if-no-files-found: error
          retention-days: 7

  # End

